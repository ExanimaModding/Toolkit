[package]
name = "emtk_framework"
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
required-features = []

# To generate headers:
# cargo run -p emtk_framework --features headers --bin generate-headers

[[bin]]
name = "generate-headers"
required-features = ["headers"]

[dependencies]
ansi_term.workspace = true
anyhow.workspace = true
detours-sys.workspace = true
emtk.workspace = true
emtk_framework_types.workspace = true
hudhook = { workspace = true, features = [
  "opengl3",
  "imgui-docking",
  "imgui-tables-api",
] }
image.workspace = true
libloading.workspace = true
libmem = { workspace = true, features = ["static"] }
open.workspace = true
path-clean.workspace = true
pelite.workspace = true
safer-ffi.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
windows = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Memory",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_ProcessStatus",
  "Win32_UI_Input",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
headers = ["safer-ffi/headers"]

[build-dependencies]
flate2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tar.workspace = true
