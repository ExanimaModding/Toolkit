cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = [
  "crates/detours",
  "asset",
  "core",
  "framework",
  "framework_types",
  "launcher",
  "tools/*",
]
default-members = ["launcher"]

[workspace.package]
version = "0.1.0-dev"
authors = ["Megumin <megumin@megu.dev>", "ProffDea <deatea@riseup.net>"]
edition = "2024"
documentation = "https://exanimamodding.codeberg.page/Book"
homepage = "https://exanimamodding.codeberg.page/Book"
repository = "https://codeberg.org/ExanimaModding/Toolkit"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ansi_term = "0.12"
anyhow = "1.0"
bon = "3.3"
clap = "4.5"
deku = "0.19"
detours-sys = { path = "./crates/detours" }
dirs = "6.0"
emtk = { version = "0.1.0-dev", path = "." }
emtk_asset = { version = "0.1.0-dev", path = "asset" }
emtk_core = { version = "0.1.0-dev", path = "core" }
emtk_framework = { version = "0.1.0-dev", path = "framework" }
emtk_framework_types = { version = "0.1.0-dev", path = "framework_types" }
flate2 = "1.1.1"
getset = "0.1"
hudhook = { version = "0.9.3", default-features = false }
iced = "0.15.0-dev"
iced_split = "0.2.0-dev"
image = { version = "0.25", default-features = false, features = [
  "ico",
  "png",
] }
libloading = "0.8"
libmem = { version = "5.0.4", default-features = false }
open = "5.3"
path-clean = "1.0"
pelite = "0.10"
pretty_assertions = "1.4.1"
reqwest = "0.12.15"
rfd = "0.15"
ron = "0.8"
safer-ffi = { version = "0.1", default-features = false, features = [
  "alloc",
  "log",
] }
serde = { version = "1.0", features = ["derive"] }
tar = "0.4.44"
tempfile = "3.16"
termimad = "0.13"
thiserror = "2.0"
tokio = { version = "1", features = [
  "io-std",
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
] }
tokio-test = "0.4.6"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = "0.62.2"
winresource = "0.1"

[package]
name = "emtk"
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
emtk_asset.workspace = true
emtk_core.workspace = true

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
rustflags = ["-Zlocation-detail=none"]

[profile.release.package.emtk_framework]
opt-level = 3

[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", rev = "08eb93ad476597889eb4597f22b4198f5545abb9" }
iced_core = { git = "https://github.com/iced-rs/iced.git", rev = "08eb93ad476597889eb4597f22b4198f5545abb9" }
iced_split = { git = "https://github.com/edwloef/iced_split.git", rev = "a8b7da03a0396b356143c3b2ea8b61aeb3a06fc1" }
